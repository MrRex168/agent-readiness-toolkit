name: manual-real-world-audit
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Run limited public-site audits
        shell: bash
        run: |
          mkdir -p audit-results
          for site in https://www.python.org https://www.djangoproject.com https://www.wikipedia.org; do
            name=$(printf '%s' "$site" | sed -E 's@https://@@;s@[^A-Za-z0-9]@_@g')
            agent-readiness scan "$site" --output json > "audit-results/$name.json" || echo "Audit failed for $site; investigate before counting it"
          done
      - name: Generate independent review worksheets
        shell: bash
        run: |
          for report in audit-results/*.json; do
            [ -s "$report" ] || continue
            agent-readiness review-template "$report" > "${report%.json}.review.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-world-audit-candidates
          path: audit-results/
          retention-days: 14
          if-no-files-found: warn
