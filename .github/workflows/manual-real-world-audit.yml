name: manual-real-world-audit
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Collect bounded source evidence and generate offline reports
        run: python scripts/collect_validation_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-world-audit-evidence
          path: audit-results/
          retention-days: 7
          if-no-files-found: warn
