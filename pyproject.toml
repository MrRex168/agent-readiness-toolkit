[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-readiness-toolkit"
version = "0.1.0"
description = "Evidence-based machine-readability audits for websites and APIs"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "typer>=0.12,<1", "rich>=13,<15"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
agent-readiness = "agent_readiness.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
